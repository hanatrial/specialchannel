<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MDS Special Channel (Makassar)</title>
<meta name="theme-color" content="#162C21">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEAE0;--bg2:#E4E0D5;--surface:#FAFAF7;--primary:#162C21;--accent:#2DBF5A;
  --a-light:rgba(45,191,90,.09);--text:#0D0D0B;--t2:#525549;--t3:#9BA098;
  --border:rgba(22,44,33,.12);--danger:#DC2626;--ok:#16A34A;
  --sh:0 1px 2px rgba(22,44,33,.04),0 3px 10px rgba(22,44,33,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 120px}
header{background:var(--primary);color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:5}
header .row{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
header a.back{color:#fff;text-decoration:none;font-size:22px;width:32px}
header h1{font-size:17px;font-weight:800}
header p{font-size:12px;opacity:.7}
.tabs{max-width:560px;margin:12px auto 0;display:flex;gap:6px}
.tab{flex:1;padding:9px;border-radius:10px;border:none;background:rgba(255,255,255,.1);color:#fff;font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.tab.on{background:#fff;color:var(--primary)}
.sec{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--t3);text-transform:uppercase;margin:22px 4px 8px}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--sh);padding:14px;border:1px solid var(--border)}
label.l{display:block;font-size:12px;font-weight:700;color:var(--t2);margin:12px 0 6px}
label.l:first-child{margin-top:0}
label.l .req{color:var(--danger)}
input[type=text],input[type=tel],input[type=number],input[type=date],textarea,select{width:100%;border:1.5px solid var(--border);border-radius:11px;padding:12px;font:inherit;font-size:15px;background:#fff;color:var(--text);outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:70px;resize:vertical}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips.three{grid-template-columns:1fr}
.chip{border:1.5px solid var(--border);border-radius:12px;padding:12px 10px;background:#fff;font:inherit;font-size:14px;font-weight:700;color:var(--t2);cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px}
.chip.on{border-color:var(--accent);background:var(--a-light);color:var(--primary)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:12px;border:none;font:inherit;font-weight:800;font-size:15px;cursor:pointer;background:var(--primary);color:#fff}
.btn.ghost{background:var(--bg2);color:var(--primary)}
.btn.wa{background:#25D366}
.btn:disabled{opacity:.5}
.gps{margin-top:10px;font-size:13px;color:var(--t2)}
.gps.ok{color:var(--ok);font-weight:700}
.gps a{color:inherit}
.search{margin-bottom:10px}
.grp{border-top:1px solid var(--border)}
.grp:first-child{border-top:none}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;font-weight:800;font-size:13px;cursor:pointer}
.grp-h .n{font-size:11px;background:var(--accent);color:#fff;border-radius:20px;padding:2px 8px}
.grp-b{display:none;padding-bottom:8px}
.grp.open .grp-b{display:block}
.it{display:flex;align-items:center;gap:10px;padding:8px 2px;font-size:13px}
.it input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex-shrink:0}
.it{border-top:1px solid var(--border);padding:10px 2px}
.it:first-child{border-top:none}
.it .nm{flex:1;line-height:1.3;font-weight:600}
.it .cat{display:block;font-size:11px;font-weight:700;color:var(--t3);margin-top:2px}
.it .c{width:36px;display:flex;justify-content:center;flex-shrink:0}
.it .o{width:64px;flex-shrink:0;text-align:center}
.it input.o{padding:8px 4px;font-size:14px}
.it.ith{font-size:11px;font-weight:800;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;padding-top:0}
.it.ith .nm{font-weight:800}
.ph{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.phbox{aspect-ratio:1;border:2px dashed var(--border);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--t3);cursor:pointer;background:#fff center/cover no-repeat;text-align:center;padding:6px;position:relative}
.phbox.has{border-style:solid;color:transparent}
.phbox .x{display:none;position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:24px;height:24px;line-height:24px;font-size:14px}
.phbox.has .x{display:block}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}
.foot .in{max-width:560px;margin:0 auto}
.hist{display:flex;flex-direction:column;gap:10px}
.h-item .t{font-weight:800;font-size:15px}
.h-item .m{font-size:12px;color:var(--t2);margin-top:3px}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px;background:var(--a-light);color:var(--primary);margin-right:4px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.filters .chip{flex-shrink:0;padding:8px 12px;font-size:12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:90%}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--t3);padding:30px;font-size:14px}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <div class="row">
    <a class="back" href="https://hanatrial.github.io/VISIT/" title="Kembali">‹</a>
    <div><h1>MDS Special Channel (Makassar)</h1><p>Gym &amp; Sport Center · Horeka</p></div>
  </div>
  <div class="tabs">
    <button class="tab on" data-tab="form">Visit Baru</button>
    <button class="tab" data-tab="hist">Riwayat</button>
  </div>
</header>

<div class="wrap" id="v-form">
  <div class="sec">MDS</div>
  <div class="card">
    <label class="l">Nama MDS <span class="req">*</span></label>
    <input type="text" id="mds" placeholder="Nama kamu">
    <label class="l">Tanggal Visit <span class="req">*</span></label>
    <input type="date" id="vdate">
  </div>

  <div class="sec">Activity</div>
  <div class="card"><div class="chips three" id="activity"></div></div>

  <div class="sec">Channel</div>
  <div class="card"><div class="chips" id="channel"></div></div>

  <div class="sec">Outlet</div>
  <div class="card">
    <label class="l">Nama Outlet <span class="req">*</span></label>
    <input type="text" id="outlet" placeholder="cth. Fitness One Kendari">
    <label class="l">Alamat</label>
    <textarea id="address" placeholder="Alamat outlet"></textarea>
    <div style="margin-top:12px"><button class="btn ghost" id="gpsBtn" type="button">📍 Check-in GPS</button></div>
    <div class="gps" id="gpsTxt">Belum check-in</div>
  </div>

  <div class="sec">PIC Outlet</div>
  <div class="card">
    <label class="l">Nama PIC <span class="req">*</span></label>
    <input type="text" id="pic" placeholder="Nama contact person">
    <label class="l">Jabatan <span class="req">*</span></label>
    <input type="text" id="picRole" placeholder="cth. Manager, Owner, F&amp;B, Purchasing">
    <label class="l">No. HP PIC <span class="req">*</span></label>
    <input type="tel" id="picPhone" placeholder="08xxxxxxxxxx" inputmode="tel">
  </div>

  <div class="sec">Produk &amp; Order (opsional)</div>
  <div class="card">
    <input type="text" class="search" id="q" placeholder="🔍 Cari produk…">
    <div id="products"></div>
  </div>

  <div class="sec">Foto</div>
  <div class="card">
    <div class="ph">
      <div class="phbox" id="ph-display" data-k="display">📷<br>Foto Display <span style="color:var(--danger)">*</span><span class="x">✕</span></div>
      <div class="phbox" id="ph-comp" data-k="comp">📷<br>Foto Kompetitor <span style="color:var(--danger)">*</span><span class="x">✕</span></div>
    </div>
    <input type="file" id="file" accept="image/*" capture="environment" class="hidden">
  </div>

  <div class="sec">Catatan</div>
  <div class="card">
    <label class="l">Catatan <span class="req">*</span></label>
    <textarea id="notes" placeholder="Potensi order, kebutuhan outlet, follow up…"></textarea>
  </div>
</div>

<div class="wrap hidden" id="v-hist">
  <div class="sec">Filter</div>
  <div class="filters" id="hFilter"></div>
  <div class="sec" id="hCount">Riwayat</div>
  <div class="hist" id="hList"><div class="empty">Memuat…</div></div>
  <div style="margin-top:14px"><button class="btn ghost" id="csvBtn">⬇️ Export CSV</button></div>
</div>

<div class="foot" id="foot"><div class="in"><button class="btn" id="saveBtn">Simpan Visit</button></div></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="products.js"></script>
<script src="app.js"></script>
</body>
</html>
